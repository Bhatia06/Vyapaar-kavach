# ---------------------------------------------------------------------------
# Vyapaar Kavach — local Postgres service (OPTIONAL).
#
# The default demo runs on SQLite with zero external services. Use this file
# when you want the fuller Postgres-backed setup (closer to production lock /
# transaction semantics):
#
#   docker compose up -d db
#   set DATABASE_URL=postgresql+psycopg2://vyapaar:vyapaar@localhost:5432/vyapaar
#   python -m services.api.fixtures.seed
#   uvicorn services.api.app.main:app --reload
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    container_name: vyapaar_kavach_db
    environment:
      POSTGRES_USER: vyapaar
      POSTGRES_PASSWORD: vyapaar
      POSTGRES_DB: vyapaar
    ports:
      - "5432:5432"
    volumes:
      - vyapaar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapaar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vyapaar_pgdata:
